plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "mil.defense.bmspro"
    compileSdkVersion 34

    defaultConfig {
        applicationId "mil.defense.bmspro"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 24
        versionName "2.4.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
